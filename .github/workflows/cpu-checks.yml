name: CPU experiment checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-cpu.txt
      - run: python -m unittest discover -s tests -v
      - run: python recovery_tools/run_workshop_functional_suite.py --gpu 0 --dry-run
